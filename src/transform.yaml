name: 'upheno_phenotype_to_phenotype'

reader:
  format: 'csv'
  delimiter: '\t'
  files:
    - '../data/upheno-cross-species.sssom.tsv'
  columns:
    - 'subject_id'
    - 'subject_label'
    - 'predicate_id'
    - 'object_id'
    - 'object_label'
    - 'mapping_justification'
    - 'subject_source'
    - 'object_source'
  filters:
    - inclusion: 'exclude'
      column: 'subject_source'
      filter_code: 'eq'
      value: 'obo:upheno'
    - inclusion: 'exclude'
      column: 'object_source'
      filter_code: 'eq'
      value: 'obo:upheno'

writer:
  node_properties:
    - id
    - name
    - category
  edge_properties:
    - id
    - subject
    - predicate
    - object
    - subject_category
    - object_category
    - category
    - primary_knowledge_source
    - knowledge_source
    - knowledge_level
    - has_attribute
    - agent_type
    - original_predicate
